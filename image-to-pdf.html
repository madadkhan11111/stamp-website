<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image to PDF Online Free – JPG/PNG to PDF Privately | OnlineStampDoc</title>
    <meta name="description" content="Convert JPG or PNG images to PDF online free. Private browser conversion — no file uploads.">
    <link rel="canonical" href="https://onlinestampdoc.com/image-to-pdf.html">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" media="print" onload="this.media='all'">
    <link rel="stylesheet" href="styles.css?v=20260809c">
    <link rel="stylesheet" href="tools.css?v=2">
</head>
<body>
    <div class="app-background"><div class="blob blob-1"></div><div class="blob blob-2"></div></div>
    <header class="app-header">
        <a href="/" class="logo"><i class="fa-solid fa-stamp"></i><span>Online Stamp Doc</span></a>
        <nav class="tool-page-nav"><a href="tools.html">All Tools</a><a href="image-to-pdf.html" class="active">Image to PDF</a><a href="/">Stamp Maker</a></nav>
    </header>
    <section class="tool-hero">
        <div class="tool-badge"><i class="fa-solid fa-shield-halved"></i> Private — No Upload</div>
        <h1>Image to PDF Converter</h1>
        <p>Combine JPG/PNG images into one PDF file instantly in your browser.</p>
    </section>
    <main class="tool-layout">
        <aside class="glass-panel tool-panel">
            <div class="tool-drop" id="drop-zone">
                <i class="fa-solid fa-images"></i>
                <p><strong>Drop images here</strong> or browse</p>
                <p class="file-limits">JPG / PNG · Multiple files OK</p>
                <input type="file" id="file-input" accept="image/jpeg,image/png,image/jpg" multiple hidden>
            </div>
            <p id="status" class="easy-help" style="margin-top:0.75rem;"></p>
            <div class="tool-actions">
                <button type="button" class="primary-btn" id="export-btn" disabled><i class="fa-solid fa-download"></i> Download PDF</button>
                <button type="button" class="secondary-btn" id="clear-btn" disabled>Clear</button>
            </div>
        </aside>
        <section class="glass-panel">
            <h2 style="margin-bottom:1rem;">Selected images</h2>
            <div class="tool-preview-wrap" id="preview-wrap" style="flex-wrap:wrap; gap:0.75rem; align-content:flex-start;">
                <p style="color:var(--text-secondary);">Add one or more images.</p>
            </div>
        </section>
    </main>
    <div class="loading-overlay hidden" id="loading-overlay"><div class="spinner"></div><p id="loading-text">Processing...</p></div>
    <script src="tools-common.js"></script>
    <script src="image-to-pdf.js" defer></script>
</body>
</html>
