<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script>
        (function () {
            var host = location.hostname;
            var path = location.pathname;
            if (host === 'www.onlinestampdoc.com') {
                location.replace('https://onlinestampdoc.com' + path + location.search + location.hash);
                return;
            }
            if (host !== 'onlinestampdoc.com') return;
            if (path.length > 1 && !path.endsWith('/') && path.indexOf('.') === -1) {
                location.replace(path + '.html' + location.search + location.hash);
            }
        })();
    </script>
    <meta name="google-adsense-account" content="ca-pub-2509436669190309">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crop Image Online Free – JPG PNG Private | OnlineStampDoc</title>
    <meta name="description" content="Crop a JPG or PNG online free. Trim edges in your browser — no uploads.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://onlinestampdoc.com/crop-image.html">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" media="print" onload="this.media='all'">
    <link rel="stylesheet" href="styles.css?v=20260925f">
    <link rel="stylesheet" href="tools.css?v=20260925d">
    <script src="ads-consent.js"></script>
</head>
<body>
    <div class="app-background"><div class="blob blob-1"></div><div class="blob blob-2"></div></div>
    <header class="app-header">
        <a href="/" class="logo"><i class="fa-solid fa-stamp"></i><span>Online Stamp Doc</span></a>
        <nav class="tool-page-nav"><a href="tools.html">All Tools</a><a href="crop-image.html" class="active">Crop Image</a><a href="/">Stamp Maker</a></nav>
    </header>
    <section class="tool-hero">
        <div class="tool-badge"><i class="fa-solid fa-shield-halved"></i> Private — No Upload</div>
        <h1>Crop Image</h1>
        <p>Trim the edges of a photo and download the cropped file instantly.</p>
    </section>
    <main class="tool-layout">
        <aside class="glass-panel tool-panel">
            <div class="tool-drop" id="drop-zone">
                <i class="fa-solid fa-crop"></i>
                <p><strong>Drop image here</strong> or browse</p>
                <p class="file-limits">JPG / PNG / WEBP · Max 10MB</p>
                <input type="file" id="file-input" accept="image/jpeg,image/png,image/webp" hidden>
            </div>
            <div class="control-group" style="margin-top:1rem;"><label for="top">Top: <span id="top-val">10%</span></label><input type="range" id="top" class="glass-slider" min="0" max="40" step="1" value="10"></div>
            <div class="control-group"><label for="bottom">Bottom: <span id="bottom-val">10%</span></label><input type="range" id="bottom" class="glass-slider" min="0" max="40" step="1" value="10"></div>
            <div class="control-group"><label for="left">Left: <span id="left-val">10%</span></label><input type="range" id="left" class="glass-slider" min="0" max="40" step="1" value="10"></div>
            <div class="control-group"><label for="right">Right: <span id="right-val">10%</span></label><input type="range" id="right" class="glass-slider" min="0" max="40" step="1" value="10"></div>
            <p id="status" class="easy-help" style="margin-top:0.75rem;"></p>
            <div class="tool-actions">
                <button type="button" class="primary-btn" id="export-btn" disabled><i class="fa-solid fa-download"></i> Download Cropped Image</button><button type="button" class="secondary-btn" id="clear-btn" disabled>Clear</button>
            </div>
        </aside>
        <section class="glass-panel">
            <h2 style="margin-bottom:1rem;">Preview</h2>
            <div class="tool-preview-wrap" id="preview-wrap"><p style="color:var(--text-secondary);">Upload an image to crop it.</p></div>
        </section>
    </main>
    <div class="loading-overlay hidden" id="loading-overlay"><div class="spinner"></div><p id="loading-text">Processing...</p></div>
    <script src="tools-common.js"></script>
    <script src="crop-image.js" defer></script>
</body>
</html>
