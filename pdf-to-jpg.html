<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF to JPG Online Free – Convert PDF Pages Privately | OnlineStampDoc</title>
    <meta name="description" content="Convert PDF pages to JPG images online free. Private browser conversion — files never upload to a server.">
    <link rel="canonical" href="https://onlinestampdoc.com/pdf-to-jpg.html">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" media="print" onload="this.media='all'">
    <link rel="stylesheet" href="styles.css?v=20260809c">
    <link rel="stylesheet" href="tools.css?v=2">
</head>
<body>
    <div class="app-background"><div class="blob blob-1"></div><div class="blob blob-2"></div></div>
    <header class="app-header">
        <a href="/" class="logo"><i class="fa-solid fa-stamp"></i><span>Online Stamp Doc</span></a>
        <nav class="tool-page-nav"><a href="tools.html">All Tools</a><a href="pdf-to-jpg.html" class="active">PDF to JPG</a><a href="/">Stamp Maker</a></nav>
    </header>
    <section class="tool-hero">
        <div class="tool-badge"><i class="fa-solid fa-shield-halved"></i> Private — No Upload</div>
        <h1>PDF to JPG Converter</h1>
        <p>Turn each PDF page into a JPG image in your browser, then download.</p>
    </section>
    <main class="tool-layout">
        <aside class="glass-panel tool-panel">
            <div class="tool-drop" id="drop-zone">
                <i class="fa-solid fa-file-image"></i>
                <p><strong>Drop PDF here</strong> or browse</p>
                <p class="file-limits">PDF · Max 10MB</p>
                <input type="file" id="file-input" accept="application/pdf" hidden>
            </div>
            <div class="control-group" style="margin-top:1rem;">
                <label for="quality">JPG quality: <span id="quality-val">0.92</span></label>
                <input type="range" id="quality" class="glass-slider" min="0.5" max="1" step="0.02" value="0.92">
            </div>
            <div class="control-group">
                <label for="scale">Render scale: <span id="scale-val">1.5</span></label>
                <input type="range" id="scale" class="glass-slider" min="1" max="2.5" step="0.1" value="1.5">
            </div>
            <div class="tool-actions">
                <button type="button" class="primary-btn" id="export-btn" disabled><i class="fa-solid fa-download"></i> Download Page 1 JPG</button>
                <button type="button" class="secondary-btn" id="export-all-btn" disabled>Download All Pages</button>
                <button type="button" class="secondary-btn" id="clear-btn" disabled>Clear</button>
            </div>
            <p id="status" class="easy-help" style="margin-top:0.75rem;"></p>
        </aside>
        <section class="glass-panel">
            <h2 style="margin-bottom:1rem;">Preview</h2>
            <div class="tool-preview-wrap" id="preview-wrap"><p style="color:var(--text-secondary);">Upload a PDF to preview page 1.</p></div>
        </section>
    </main>
    <div class="loading-overlay hidden" id="loading-overlay"><div class="spinner"></div><p id="loading-text">Processing...</p></div>
    <script src="tools-common.js"></script>
    <script src="pdf-to-jpg.js" defer></script>
</body>
</html>
