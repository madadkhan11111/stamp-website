<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script>
        (function () {
            var host = location.hostname;
            var path = location.pathname;
            if (host === 'www.onlinestampdoc.com') {
                location.replace('https://onlinestampdoc.com' + path + location.search + location.hash);
                return;
            }
            if (host !== 'onlinestampdoc.com') return;
            if (path.length > 1 && !path.endsWith('/') && path.indexOf('.') === -1) {
                location.replace(path + '.html' + location.search + location.hash);
            }
        })();
    </script>
    <meta name="google-adsense-account" content="ca-pub-2509436669190309">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watermark Image Online Free – Add Text to Photo | OnlineStampDoc</title>
    <meta name="description" content="Add a text watermark to a JPG or PNG online free. Private browser tool — files never leave your device.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://onlinestampdoc.com/watermark-image.html">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" media="print" onload="this.media='all'">
    <link rel="stylesheet" href="styles.css?v=20260925h">
    <link rel="stylesheet" href="tools.css?v=20260925d">
    <script src="ads-consent.js"></script>
</head>
<body>
    <div class="app-background"><div class="blob blob-1"></div><div class="blob blob-2"></div></div>
    <header class="app-header">
        <a href="/" class="logo"><i class="fa-solid fa-stamp"></i><span>Online Stamp Doc</span></a>
        <nav class="tool-page-nav"><a href="tools.html">All Tools</a><a href="watermark-image.html" class="active">Watermark Image</a><a href="/">Stamp Maker</a></nav>
    </header>
    <section class="tool-hero">
        <div class="tool-badge"><i class="fa-solid fa-shield-halved"></i> Private — No Upload</div>
        <h1>Watermark Image</h1>
        <p>Put your name, website, or CONFIDENTIAL across a photo. Preview updates live.</p>
    </section>
    <main class="tool-layout">
        <aside class="glass-panel tool-panel">
            <div class="tool-drop" id="drop-zone">
                <i class="fa-solid fa-droplet"></i>
                <p><strong>Drop image here</strong> or browse</p>
                <p class="file-limits">JPG / PNG / WEBP · Max 10MB</p>
                <input type="file" id="file-input" accept="image/jpeg,image/png,image/webp" hidden>
            </div>
            <div class="control-group" style="margin-top:1rem;">
                <label for="wm-text">Watermark text</label>
                <input type="text" id="wm-text" class="glass-input" value="CONFIDENTIAL" maxlength="40">
            </div>
            <div class="control-group">
                <label for="wm-opacity">Opacity: <span id="wm-opacity-val">35%</span></label>
                <input type="range" id="wm-opacity" class="glass-slider" min="0.1" max="0.9" step="0.05" value="0.35">
            </div>
            <div class="control-group">
                <label for="wm-size">Size: <span id="wm-size-val">48</span></label>
                <input type="range" id="wm-size" class="glass-slider" min="18" max="120" step="2" value="48">
            </div>
            <div class="control-group">
                <label for="wm-angle">Angle: <span id="wm-angle-val">-24°</span></label>
                <input type="range" id="wm-angle" class="glass-slider" min="-60" max="60" step="1" value="-24">
            </div>
            <div class="control-group">
                <label for="wm-color">Color</label>
                <input type="color" id="wm-color" value="#e5322d" aria-label="Watermark color">
            </div>
            <p id="status" class="easy-help" style="margin-top:0.75rem;"></p>
            <div class="tool-actions">
                <button type="button" class="primary-btn" id="export-btn" disabled><i class="fa-solid fa-download"></i> Download JPG</button>
                <button type="button" class="secondary-btn" id="clear-btn" disabled>Clear</button>
            </div>
        </aside>
        <section class="glass-panel">
            <h2 style="margin-bottom:1rem;">Preview</h2>
            <div class="tool-preview-wrap" id="preview-wrap"><p style="color:var(--text-secondary);">Upload a photo to watermark it.</p></div>
        </section>
    </main>
    <div class="loading-overlay hidden" id="loading-overlay"><div class="spinner"></div><p id="loading-text">Processing...</p></div>
    <script src="tools-common.js"></script>
    <script src="watermark-image.js" defer></script>
</body>
</html>
